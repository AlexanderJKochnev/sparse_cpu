services:
  sparse-embedder:
    build: .
    container_name: sparse-embedder
    restart: unless-stopped
    environment:
      # LABSE_LOCAL_DIR: /app/models/LaBSE-ru-turbo
      # LABSE_LOCAL_DIR: /app/models/LaBSE-en-ru-coi
      # LABSE_LOCAL_DIR: /app/models/ai-forever/ru-en-RoSBERTa
      # LABSE_LOCAL_DIR: /app/models/multilingual-e5-large
      LABSE_LOCAL_DIR: /app/models/opensearch-neural-sparse-encoding-multilingual-v1
      LABSE_CPU_THREADS: "4"
      VECTOR_DTYPE: "float16"
    volumes:
      - ${BIND_VOLUMES}/vllm_node/models:/app/models:ro
    networks:
      - vllm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  vllm_network:
    name: vllm_network
    driver: bridge
    external: true

volumes:
  models: